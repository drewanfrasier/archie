name: Release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(jq -r .version plugins/archie/.claude-plugin/plugin.json)
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match plugin.json version $version"
            exit 1
          fi

      - name: Build archie.zip
        working-directory: plugins/archie/skills
        run: zip -r "$GITHUB_WORKSPACE/archie.zip" archie -x '*.DS_Store'

      - name: Attach archie.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" archie.zip --clobber
